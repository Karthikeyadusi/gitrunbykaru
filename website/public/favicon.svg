<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1326" />
      <stop offset="100%" stop-color="#0d0914" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#eb4eac" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#eb4eac" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Command Prompt Dollar Sign / Chevron -->
  <path d="M18 22 L30 32 L18 42" fill="none" stroke="url(#magentaGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Cursor Line -->
  <line x1="36" y1="42" x2="48" y2="42" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
</svg>